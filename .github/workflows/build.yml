name: Build EXE Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl fpdf2

      - name: Compilar EXE
        run: pyinstaller --onefile --name CatalogoWhatsAppGenerator catalogo_generator.py

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: CatalogoWhatsAppGenerator
          path: dist/CatalogoWhatsAppGenerator.exe
